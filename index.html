<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Schoolink</title>
    <meta name="description" content="Connecting schools, staff, parents and communities worldwide." />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#241B4E" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Hide Google Translate's default banner/toolbar — we trigger
         translation silently via our own UI instead. */
      .goog-te-banner-frame, .skiptranslate { display: none !important; }
      body { top: 0 !important; }
      #google_translate_element { display: none; }
    </style>
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="google-site-verification" content="g4VnVcehS-luze252KWrTjTmy0PvzHrajhvJm9zOYrg" />
  </head>
  <body class="bg-brand-light">
    <div id="root"></div>
    <div id="google_translate_element"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element')
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
      </body>
</html>
