name: Build Android app

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Use the Schoolink logo as the app icon and opening screen
        run: |
          npm install --no-save sharp @capacitor/assets
          mkdir -p assets
          cat > make-android-icons.mjs <<'EOF'
          import sharp from 'sharp'
          import fs from 'node:fs'
          // Colours and shape come from your own public/icon.svg, so changing that file changes the app icon.
          let BG = '#6C4CE0'
          let GLYPH = 'M256 140 96 200l160 60 130-49v70h20V200zm-95 100v70c0 30 42 55 95 55s95-25 95-55v-70l-95 36z'
          try {
            const svg = fs.readFileSync('public/icon.svg', 'utf8')
            const bg = svg.match(/<rect[^>]*fill="([^"]+)"/)
            const d = svg.match(/<path[^>]*\sd="([^"]+)"/)
            if (bg) BG = bg[1]
            if (d) GLYPH = d[1]
            console.log('Using public/icon.svg', BG)
          } catch (e) {
            console.log('public/icon.svg not found, using the built-in logo')
          }
          function art(scale, background, rx) {
            const t = `translate(${256 - 256 * scale} ${256 - 256 * scale}) scale(${scale})`
            const bg = background ? `<rect width="512" height="512" rx="${rx}" fill="${BG}"/>` : ''
            return Buffer.from(
              `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">${bg}<g transform="${t}"><path fill="#fff" d="${GLYPH}"/></g></svg>`
            )
          }
          const glyph = `<path fill="#fff" d="${GLYPH}"/>`
          // Opening screen: white page, the logo in the middle, "Schoolink" under it.
          const splash = Buffer.from(
            `<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">` +
              `<rect width="2732" height="2732" fill="#FFFFFF"/>` +
              `<g transform="translate(1046 950) scale(1.25)"><rect width="512" height="512" rx="96" fill="${BG}"/>${glyph}</g>` +
              `<text x="1366" y="1790" text-anchor="middle" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="170" font-weight="700" fill="#241B4E">Schoolink</text>` +
              `</svg>`
          )
          const jobs = [
            ['assets/icon-only.png', art(0.8, true, 96), 1024],
            ['assets/icon-foreground.png', art(0.55, false, 0), 1024],
            ['assets/icon-background.png', Buffer.from(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="${BG}"/></svg>`), 1024],
            ['assets/splash.png', splash, 2732],
            ['assets/splash-dark.png', splash, 2732],
          ]
          for (const [file, input, size] of jobs) {
            const density = size === 2732 ? 72 : Math.ceil((72 * size) / 512)
            await sharp(input, { density }).resize(size, size).png().toFile(file)
            console.log('made', file)
          }
          EOF
          node make-android-icons.mjs
          npx capacitor-assets generate --android

      - name: Let the app catch the Google sign-in link
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'com.schoolink.app' not in s:
              link = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.schoolink.app" android:host="auth" />
              </intent-filter>
              '''
              s = s.replace('</activity>', link + '\n        </activity>', 1)
              open(p, 'w').write(s)
              print("Added intent-filter")
          else:
              print("intent-filter already exists")
          PY

      - name: Turn on push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json added"
          else
            echo "No GOOGLE_SERVICES_JSON secret, building without push notifications"
          fi
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perm = 'android.permission.POST_NOTIFICATIONS'
          if perm not in s:
              s = s.replace('<application', '<uses-permission android:name="' + perm + '" />\n    <application', 1)
              open(p, 'w').write(s)
              print("Added notification permission")
          PY

      - name: Ask the phone for the permissions the app needs
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
          ]
          added = 0
          for line in perms:
              key = line.split('android:name="')[1].split('"')[0]
              if key not in s:
                  s = s.replace('<application', line + '\n    <application', 1)
                  added += 1
          open(p, 'w').write(s)
          print("Added", added, "permissions")
          PY

      - name: Match the website look and sharpen the opening screen
        run: |
          python3 - <<'PY'
          import os, re
          res = 'android/app/src/main/res'
          styles_path = res + '/values/styles.xml'
          styles = open(styles_path).read() if os.path.exists(styles_path) else ''

          # Same colours as the website: status bar matches the website's theme colour.
          if styles and 'statusBarColor' not in styles:
              pattern = r'(<style name="AppTheme.NoActionBar"[^>]*>)'
              if re.search(pattern, styles):
                  add = '\\1\n        <item name="android:statusBarColor">#241B4E</item>\n        <item name="android:forceDarkAllowed">false</item>'
                  styles = re.sub(pattern, add, styles, count=1)
                  open(styles_path, 'w').write(styles)
                  print("Status bar colour set")

          # Crisp opening screen on Android 12 and newer: a vector logo that stays sharp at any size.
          bg, glyph = '#6C4CE0', 'M256 140 96 200l160 60 130-49v70h20V200zm-95 100v70c0 30 42 55 95 55s95-25 95-55v-70l-95 36z'
          if os.path.exists('public/icon.svg'):
              svg = open('public/icon.svg').read()
              m1 = re.search(r'<rect[^>]*fill="([^"]+)"', svg)
              m2 = re.search(r'<path[^>]*\sd="([^"]+)"', svg)
              if m1: bg = m1.group(1)
              if m2: glyph = m2.group(1)
          if 'AppTheme.NoActionBarLaunch' in styles and 'AppTheme.NoActionBar"' in styles:
              os.makedirs(res + '/drawable', exist_ok=True)
              os.makedirs(res + '/values-v31', exist_ok=True)
              open(res + '/drawable/splash_logo.xml', 'w').write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    android:width="288dp" android:height="288dp"\n'
                  '    android:viewportWidth="512" android:viewportHeight="512">\n'
                  '  <group android:scaleX="0.85" android:scaleY="0.85" android:pivotX="256" android:pivotY="256">\n'
                  '    <path android:fillColor="' + bg + '" android:pathData="' + glyph + '"/>\n'
                  '  </group>\n'
                  '</vector>\n')
              open(res + '/values-v31/splash_v31.xml', 'w').write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n'
                  '        <item name="android:windowSplashScreenBackground">#FFFFFF</item>\n'
                  '        <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>\n'
                  '    </style>\n'
                  '</resources>\n')
              print("Sharp opening screen added")
          else:
              print("Launch theme not found, skipped the sharp opening screen")
          PY

      - name: Keep the same app signature so updates keep you signed in
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            if keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null 2>&1; then
              echo "Using the saved signing key"
            else
              echo "The saved signing key is damaged, using a temporary one instead"
              rm -f ~/.android/debug.keystore
            fi
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret, using a temporary signing key"
          fi

      - run: npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: schoolink-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
